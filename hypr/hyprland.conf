#---------- НАСТРОЙКА МОНИТОРОВ ---- SETTING UP MONITORS
monitor=,preferred,auto,2

#---------- ПЕРЕМЕННЫЕ ---- VARS
$mainMod = SUPER
#$terminal = kitty
$terminal = alacritty
#$filemanager = nemo
#$filemanager = doublecmd-qt
$filemanager = alacritty -e mc

$kb_layout = us,ru
$kb_options = grp:caps_select

#---------- АВТОЗАПУСК ---- AUTOSTART
source = /etc/ximperdistro/hyprland/hypr/system-autostart.conf
#source = /etc/ximperdistro/hyprland/hypr/autostart.conf
# Обои / Wallpaper
#exec-once = hyprpaper
# Утилиты среды рабочего стола / Desktop environment utilities
#exec-once = hypridle
#exec-once = waybar
#exec-once = swaync
exec-once = qs -c noctalia-shell
# Буфер обмена / clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

source = /etc/ximperdistro/hyprland/hypr/xdg-autostart.conf

#source = /etc/ximperdistro/hyprland/hypr/plugins.conf

#---------- ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ---- ENVIRONMENT VARIABLES
source = /etc/ximperdistro/hyprland/hypr/env.conf
#env = QT_SCALE_FACTOR,1
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_ENABLE_HIGHDPI_SCALING,1
#env = GDK_SCALE,1 # only int
#env = ELM_SCALE,1
#env = GDK_DPI_SCALE,1
env = EDITOR, subl
env = PAGER, micro

#source = /etc/ximperdistro/hyprland/hypr/nvidia-env.conf

source = /etc/ximperdistro/hyprland/hypr/theme.conf

#---------- ПРОМЕЖУТКИ, ГРАНИЦЫ, ЦВЕТА ---- GAPS, BORDERS, COLORS
source = /etc/ximperdistro/hyprland/hypr/general.conf

#---------- УКРАШЕНИЯ ДЛЯ ОКОН ---- WINDOW DECORATIONS
source = /etc/ximperdistro/hyprland/hypr/decoration.conf

#---------- АНИМАЦИЯ ---- ANIMATION
source = /etc/ximperdistro/hyprland/hypr/animations.conf

#---------- РАСКЛАДКА КЛАВИАТУРЫ ---- KEYBOARD LAYOUT
#source = /etc/ximperdistro/hyprland/hypr/input.conf
input {
	kb_layout = $kb_layout
	kb_options = $kb_options
	follow_mouse = 1
        #mouse_refocus = false
        repeat_rate = 50
        repeat_delay = 250

	touchpad {
		natural_scroll = false
		scroll_factor = 0.3
		clickfinger_behavior = true
		drag_lock = true
	}

	numlock_by_default = false
	sensitivity = -0.7
        force_no_accel = true
        accel_profile = flat
}


#---------- ЖЕСТЫ ---- GESTURES
source = /etc/ximperdistro/hyprland/hypr/gestures.conf

#---------- ГРУППЫ ---- GROUPS
source = /etc/ximperdistro/hyprland/hypr/groups.conf

#---------- РАЗНОЕ ---- MISC
source = /etc/ximperdistro/hyprland/hypr/misc.conf

#---------- ПРАВИЛА ---- RULES
source = /etc/ximperdistro/hyprland/hypr/rules.conf

#---------- СОЧЕТАНИЯ КЛАВИШ ---- KEYBOARD SHORTCUTS
#source = /etc/ximperdistro/hyprland/hypr/binds.conf
binds {
    workspace_back_and_forth = false
    workspace_center_on = 1
    hide_special_on_workspace_change = true
}

#---------- ЗАПУСК ПРИЛОЖЕНИЙ ---- LAUNCHING APPLICATIONS
bind = $mainMod, E, exec, $filemanager
# bind = $mainMod, Y, exec, kitty -e mc
bind = $mainMod, W, exec, google-chrome #--force-device-scale-factor=2
bind = $mainMod, C, exec, speedcrunch
#windowrule = size (monitor_w*0.2) (monitor_h*0.5), float on, match:title SpeedCrunch
#windowrule = match:class KeePassXC, no_initial_focus on
bind = $mainMod, SPACE, exec, $terminal

#---------- ГОРЯЧИЕ КЛАВИШИ ---- KEYBOARD SHORTCUTS
bind = $mainMod, D, killactive,
bind = $mainMod, F, togglefloating,B
bind = $mainMod, F11, fullscreenstate, 2

#bind = $mainMod, Q, exec, pkill wofi || wofi --show drun
bind = $mainMod, Q, exec, qs -c noctalia-shell ipc call launcher toggle
#bind = $mainMod, L, exec, wlogout -b 5 -T 300 -B 300
bind = $mainMod, L, exec, qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod, V, exec, pkill wofi || cliphist-wofi | wl-copy
bind = $mainMod, N, exec, swaync-client -t
bind = CTRL_SHIFT, L, exec, hyprmag
bind = CTRL_SHIFT, P, exec, hyprpicker -a

bind = CTRL, B, exec, pkill -SIGUSR1 waybar
bind = $mainMod, B, exec, pkill -SIGUSR2 waybar

bind = $mainMod CTRL, B, exec, pkill waybar || waybar

# Скриншот монитора / Screenshot of the monitor
bind = , Print, exec, hyprshot -m output -z --raw | swappy -f -
# Скриншот региона / Screenshot of the region
bind = $mainMod, Print, exec, hyprshot -m region -z --raw | swappy -f -
# Скриншот окна / Screenshot of the window
bind = SHIFT, Print, exec, hyprshot -m window -z --raw | swappy -f -

#---------- УПРАВЛЕНИЕ ГРОМКОСТЬЮ ---- VOLUME CONTROL
binde= , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde= , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde= , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

#---------- УПРАВЛЕНИЕ ЯРКОСТЬЮ ---- BRIGHTNESS CONTROL
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

#---------- ПЕРЕКЛЮЧЕНИЕ ФОКУСА ---- SWITCHING THE FOCUS
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = ALT,Tab,cyclenext
bind = ALT,Tab,bringactivetotop

bind = $mainMod CTRL ALT, left, movewindow, l
bind = $mainMod CTRL ALT, right, movewindow, r
bind = $mainMod CTRL ALT, up, movewindow, u
bind = $mainMod CTRL ALT, down, movewindow, d

#---------- ПЕРЕКЛЮЧЕНИЕ РАБОЧИХ ПРОСТРАНСТВ ---- SWITCHING WORKSPACES
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, left, workspace, -1
bind = $mainMod ALT, right, workspace, +1

#---------- ПЕРЕМЕЩЕНИЕ ОКНА В ДРУГОЕ РАБОЧЕЕ ПРОСТРАНСТВО ---- MOVING A WINDOW TO ANOTHER WORKSPACE
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#---------- ПЕРЕМЕЩЕНИЕ С ПОМОЩЬЮ КОЛЕСИКА МЫШИ ---- NAVIGATE USING THE MOUSE WHEEL
bind = $mainMod, mouse_up, workspace, -1
bind = $mainMod, mouse_down, workspace, +1

#---------- ПЕРЕМЕЩЕНИЕ И ИЗМЕНЕНИЕ РАЗМЕРА ОКОН С ПОМОЩЬЮ МЫШИ ---- MOVING AND RESIZING WINDOWS WITH THE MOUSE
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#---------- ЗАКРЕПИТЬ ПЛАВАЮЩИЕ ОКНО ---- PIN A FLOATING WINDOW
bind = $mainMod, P, pin

source = /etc/ximperdistro/hyprland/hypr/special-workspace.conf
source = /etc/ximperdistro/hyprland/hypr/submaps.conf

#---------- ЭКОСИСТЕМА ---- ECOSYSTEM
source = /etc/ximperdistro/hyprland/hypr/ecosystem.conf

